# The deployment file with a VPN alongside it, for a server whose address
# YouTube refuses. Everything else matches docker-compose.ghcr.yml.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: parcourse
      POSTGRES_USER: parcourse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcourse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcourse"]
      interval: 5s
      retries: 5
  backend:
    image: ghcr.io/dimwitlabs/parcourse-backend:${PARCOURSE_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://parcourse:${POSTGRES_PASSWORD:-parcourse}@db:5432/parcourse}
      - DB_SCHEMA=${DB_SCHEMA:-public}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - YTDLP_PROXY=${YTDLP_PROXY:-http://vpn:8888}
      - VPN_CONTROL_URL=${VPN_CONTROL_URL:-http://vpn:8000}
      - VPN_ROTATIONS=${VPN_ROTATIONS:-2}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-uvSAXyWG429v7tYFyht42Jud0v--hr42pitofMf0pTY=}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173"]}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    depends_on:
      backend:
        condition: service_healthy
    image: ghcr.io/dimwitlabs/parcourse-frontend:${PARCOURSE_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}

  # YouTube refuses transcript requests from datacenter addresses, so a VPS
  # fetches through here instead. OPENVPN_USER and OPENVPN_PASSWORD are the
  # provider's OpenVPN credentials, not the ones their website logs you in with.
  vpn:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-protonvpn}
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${OPENVPN_USER:?set this to your provider's OpenVPN username}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:?set this to your provider's OpenVPN password}
      # A free account cannot sign in to a paid server, and being handed one
      # reads as a wrong password rather than the wrong server.
      - FREE_ONLY=${FREE_ONLY:-off}
      - HTTPPROXY=on
      - HTTP_CONTROL_SERVER_ADDRESS=:8000

volumes:
  postgres_data:
