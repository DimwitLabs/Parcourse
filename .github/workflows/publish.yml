name: Build and Publish

on:
  push:
    branches: ["main", "development"]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r backend/requirements.txt

      - name: Versions agree
        run: |
          backend=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/version.py)
          frontend=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' frontend/package.json | head -1)
          changelog=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          echo "backend=$backend frontend=$frontend changelog=$changelog"
          if [ "$backend" != "$frontend" ] || [ "$backend" != "$changelog" ]; then
            echo "These three must carry the same version" >&2
            exit 1
          fi

      - name: Backend tests
        working-directory: backend
        env:
          JWT_SECRET: test-secret
          ENCRYPTION_KEY: uvSAXyWG429v7tYFyht42Jud0v--hr42pitofMf0pTY=
        run: python -m unittest discover -s tests

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/dimwitlabs/parcourse-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Notes for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry for $version" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: false
