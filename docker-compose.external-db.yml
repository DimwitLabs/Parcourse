services:
  backend:
    image: ghcr.io/dimwitlabs/parcourse-backend:${PARCOURSE_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?set this to your database connection string}
      - DB_SCHEMA=${DB_SCHEMA:-public}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - YTDLP_PROXY=${YTDLP_PROXY:-}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-uvSAXyWG429v7tYFyht42Jud0v--hr42pitofMf0pTY=}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173"]}

  frontend:
    image: ghcr.io/dimwitlabs/parcourse-frontend:${PARCOURSE_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
