services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parcourse
      POSTGRES_USER: parcourse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcourse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcourse"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://parcourse:parcourse@db:5432/parcourse}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - AI_MODEL=${AI_MODEL:-openrouter/openai/gpt-4o-mini}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}

volumes:
  postgres_data:
