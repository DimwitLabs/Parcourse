services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: parcourse
      POSTGRES_USER: parcourse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcourse}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcourse"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://parcourse:${POSTGRES_PASSWORD:-parcourse}@db:5432/parcourse}
      - DB_SCHEMA=${DB_SCHEMA:-public}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - YTDLP_PROXY=${YTDLP_PROXY:-}
      - JWT_SECRET=${JWT_SECRET:?generate one, see .env.example}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?generate one, see .env.example}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173"]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # The published image serves built files and carries no toolchain, so
      # development stops at the stage that still has one.
      target: build
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/frontend/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}

volumes:
  postgres_data:
